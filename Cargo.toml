[package]
name = "meshtastic-gtk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A native GTK4 Meshtastic client for USB, Wi-Fi and Bluetooth LE"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
btleplug = "0.11"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
uuid = "1"

[build-dependencies]
protoc-bin-vendored = "3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
